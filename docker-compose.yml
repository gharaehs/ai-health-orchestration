services:
  vector-db:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - ./data/chroma:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - CHROMA_URL=http://vector-db:8000
      - MCP_RAG_URL=http://mcp-rag:8004/mcp
      # Bedrock (credentials come from the EC2 instance role — never put keys here)
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-global.anthropic.claude-opus-5-5-v1:0}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-4096}
      - LLM_READ_TIMEOUT_S=${LLM_READ_TIMEOUT_S:-300}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-6}
      - NUTRITION_MAX_TOKENS=${NUTRITION_MAX_TOKENS:-16000}
      - GROCERY_MAX_WORKERS=${GROCERY_MAX_WORKERS:-4}
      - MAX_CONCURRENT_JOBS=${MAX_CONCURRENT_JOBS:-3}
    depends_on:
        - vector-db
        - mcp-rag
    restart: unless-stopped

  frontend:
    build: ./services/frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  mcp-rag:
    build:
      context: .
      dockerfile: services/mcp-rag/Dockerfile
    ports:
      - "8004:8004"
    depends_on:
      - vector-db
    environment:
      - CHROMA_HOST=vector-db
      - CHROMA_PORT=8000